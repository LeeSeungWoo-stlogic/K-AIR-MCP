name: kair-mcp-analyze

services:
  kair-mcp-analyze:
    build:
      context: .
      dockerfile: Dockerfile
    image: kair-mcp-analyze:dev
    container_name: kair-mcp-analyze
    restart: unless-stopped
    command: ["--transport", "http"]
    ports:
      - "8111:8111"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8111"
      STONE_META_URL: "${STONE_META_URL:-${ROBO_META_URL:-http://stone-meta-api:8096}}"
      ROBO_META_URL: "${ROBO_META_URL:-http://stone-meta-api:8096}"
      NK_BACKEND_URL: "${NK_BACKEND_URL:-http://nk-backend:8000}"
      MCP_API_KEYS: "${MCP_API_KEYS:?MCP_API_KEYS is required}"
      MCP_ROW_LIMIT: "${MCP_ROW_LIMIT:-200}"
      TIBERO_JDBC_JAR: "/opt/tibero/jdbc/tibero-jdbc.jar"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nk-net
    healthcheck:
      # 생존 확인만. 의존 서비스 확인은 GET /health/ready (필수 의존이 죽으면 503).
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8111/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  nk-net:
    external: true
    name: nk-net
